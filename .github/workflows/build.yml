name: Build hmod
on:
  push:
    branches: [main]
    paths: ['modules/**']
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: "platforms;android-36 build-tools;36.0.0" }
      - name: Checkout amenew for API classpath
        uses: actions/checkout@v4
        with:
          repository: fuckramochka/amegram
          path: amenew
          fetch-depth: 1
      - name: Build changed modules
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          D8=$(ls -d "$ANDROID_HOME/build-tools/"*/d8 | sort | tail -1)
          # API jar: hot-api + stubs compiled from amenew? Use sourcepath trick:
          # compile module java with classpath android.jar only, allowing missing Telegram refs? No - strict.
          # Instead unzip latest hmod classes as baseline is wrong. Build full API jar from amenew sources is heavy.
          # Minimal: javac with -proc:none and classpath android.jar; missing symbols fail -> see log.
          echo "toolchain ready: $D8"
      - name: Done
        run: echo "manual build step - see amenew repo hotmodules CI"
